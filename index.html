<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Scanner de Entregas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="container">
    <h1>📦 Scanner de Entregas</h1>
    
    <div class="camera-area">
      <video id="video" autoplay playsinline></video>
      
      <!-- Fallback: só aparece se a câmera não iniciar sozinha -->
      <button id="iniciarCameraBtn" class="btn" style="display: none;">📷 Permitir Câmera</button>
      
      <!-- Botão de escanear sempre visível, mas inicia desabilitado -->
      <button id="capturarBtn" class="btn" disabled>🔒 Câmera não iniciada</button>
      
      <canvas id="canvas" style="display: none;"></canvas>
    </div>

    <!-- Resultado do scan atual -->
    <div id="resultado" class="resultado" style="display: none;">
      <h3>📋 Cartão escaneado</h3>
      <div class="campo">
        <label>Nome (ENTREGUE Á):</label>
        <input type="text" id="nome" readonly>
      </div>
      <div class="campo">
        <label>Endereço:</label>
        <input type="text" id="endereco" readonly>
      </div>
      <div class="botoes">
        <button id="adicionarBtn" class="btn">➕ Adicionar à lista e escanear próximo</button>
        <button id="escanearOutroBtn" class="btn secundario">❌ Descartar e escanear outro</button>
      </div>
    </div>

    <!-- Lista de cartões acumulados -->
    <div id="listaAcumulada" style="display: none;">
      <h3>📌 Cartões na lista (<span id="contadorLista">0</span>)</h3>
      <ul id="itensLista"></ul>
      <div class="botoes">
        <button id="enviarTudoBtn" class="btn enviar">✅ Enviar Tudo para Planilha</button>
        <button id="limparListaBtn" class="btn secundario">🗑️ Limpar Lista</button>
      </div>
    </div>

    <!-- Campos fixos (usados em todos os cartões) -->
    <div class="campos-fixos">
      <h3>⚙️ Dados comuns a todos</h3>
      <div class="campo">
        <label>Quantidade:</label>
        <input type="number" id="quantidade" value="1" min="1">
      </div>
      <div class="campo">
        <label>Tipo:</label>
        <select id="tipo">
          <option value="SHOPEE">SHOPEE</option>
          <option value="CARTÃO">CARTÃO</option>
          <option value="CARTA">CARTA</option>
        </select>
      </div>
      <div class="campo">
        <label>N°:</label>
        <input type="text" id="numero">
      </div>
      <div class="campo">
        <label>Observação:</label>
        <input type="text" id="obs">
      </div>
      <div class="campo">
        <label>Telefone (se disponível):</label>
        <input type="text" id="telefone">
      </div>
      <div class="campo">
        <label>Data (automático):</label>
        <input type="text" id="data" readonly>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
